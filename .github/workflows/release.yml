name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all release packages
        run: sh tools/release.sh

      - name: Parse version
        id: version
        run: |
          V=$(sed -n 's/^return "\(.*\)"$/\1/p' wereaddesktop.koplugin/wereaddesktop_version.lua)
          if [ "${GITHUB_REF_NAME:-}" != "v$V" ]; then
            echo "tag ${GITHUB_REF_NAME:-<unset>} does not match version v$V" >&2
            exit 1
          fi
          if ! printf '%s\n' "$V" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)\.(0|[1-9][0-9]*))?$'; then
            echo "invalid SemVer: $V" >&2
            exit 1
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          case "$V" in
            *-alpha.[0-9]*|*-beta.[0-9]*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.value }}
          files: |
            dist/wereaddesktop.koplugin-v${{ steps.version.outputs.value }}.tar.gz
            dist/WeRead_Kindle_Installer_v${{ steps.version.outputs.value }}.zip
            dist/WeRead_Kobo_Installer_v${{ steps.version.outputs.value }}.zip
          fail_on_unmatched_files: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
